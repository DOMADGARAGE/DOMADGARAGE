<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DOMADGARAGE — Rezervácia termínu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;500;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050608;
      --card: rgba(11, 10, 18, 0.44);
      --card-2: rgba(18, 16, 28, 0.52);
      --text: #f8fafc;
      --muted: #d8b4fe;
      --line: rgba(192, 132, 252, 0.25);
      --line-strong: rgba(168, 85, 247, 0.45);
      --accent: #9333ea;
      --accent-bright: #a855f7;
      --accent-hover: #7e22ce;
      --ok: #16a34a;
      --err: #ef4444;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 28px 14px 48px;
      position: relative;
      overflow-x: hidden;
    }

    /* Tvoja tapeta z repozitára (bg.jpg) */
    .bg-photo {
      position: fixed;
      inset: 0;
      background: url("./bg.jpg") center center / cover no-repeat;
      filter: brightness(0.48) contrast(1.1) saturate(0.9);
      z-index: -2;
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(6, 5, 12, 0.35) 0%,
        rgba(6, 5, 12, 0.50) 55%,
        rgba(6, 5, 12, 0.68) 100%
      );
      z-index: -1;
    }

    .wrap {
      max-width: 660px;
      margin: 0 auto;
    }

    .brand {
      margin-bottom: 20px;
      text-align: center;
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.9);
    }

    h1 {
      margin: 0 0 8px;
      font-family: 'Permanent Marker', cursive;
      font-size: 44px;
      font-weight: 400;
      letter-spacing: 0.05em;
      color: #ffffff;
      text-shadow:
        0 0 18px rgba(168, 85, 247, 0.75),
        0 4px 12px rgba(0, 0, 0, 0.95);
      line-height: 1.05;
    }

    .sub {
      margin: 0 auto;
      max-width: 520px;
      color: #e9d5ff;
      font-size: 14px;
      line-height: 1.45;
    }

    form {
      background: var(--card);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      border: 1px solid var(--line-strong);
      border-top: 3px solid var(--accent-bright);
      border-radius: 4px;
      padding: 22px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      font-family: 'Chakra Petch', sans-serif;
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #f3e8ff;
      margin-bottom: 6px;
      font-weight: 600;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.95);
    }

    .hint {
      display: block;
      font-family: 'Inter', sans-serif;
      font-size: 11.5px;
      text-transform: none;
      letter-spacing: 0;
      color: #cbd5e1;
      margin-top: 4px;
      font-weight: 400;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.95);
    }

    input, select, textarea {
      width: 100%;
      background: var(--card-2);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 11px 12px;
      font-family: 'Inter', sans-serif;
      font-size: 14.5px;
      outline: none;
      transition: border-color 0.14s ease, background 0.14s ease, box-shadow 0.14s ease;
    }

    input::placeholder, textarea::placeholder {
      color: rgba(233, 213, 255, 0.55);
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent-bright);
      background: rgba(24, 20, 38, 0.78);
      box-shadow: 0 0 0 2px rgba(168, 85, 247, 0.25);
    }

    select option {
      background: #12101c;
      color: #f8fafc;
    }

    textarea {
      min-height: 92px;
      resize: vertical;
    }

    .hp {
      position: absolute;
      left: -9999px;
      opacity: 0;
      pointer-events: none;
    }

    .submit-wrap {
      margin-top: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .btn-order {
      width: 100%;
      padding: 13px 20px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
      color: #ffffff;
      border: 1px solid rgba(216, 180, 254, 0.45);
      border-radius: 4px;
      font-family: 'Permanent Marker', cursive;
      font-size: 22px;
      letter-spacing: 0.08em;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(147, 51, 234, 0.45);
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
      transition: transform 0.12s ease, filter 0.15s ease, opacity 0.15s ease, box-shadow 0.15s ease;
    }

    .btn-order:not(:disabled):hover {
      filter: brightness(1.12);
      transform: translateY(-1px);
      box-shadow: 0 10px 28px rgba(168, 85, 247, 0.65);
    }

    .btn-order:not(:disabled):active {
      transform: translateY(1px);
    }

    .btn-order:disabled {
      opacity: 0.38;
      filter: grayscale(0.6);
      cursor: not-allowed;
      box-shadow: none;
    }

    .req-status {
      font-size: 12px;
      color: #e9d5ff;
      text-align: center;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.95);
    }

    .req-status.ready {
      color: #86efac;
    }

    .msg {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 4px;
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      display: none;
    }

    .msg.ok {
      display: block;
      background: rgba(22, 163, 74, 0.3);
      border: 1px solid rgba(74, 222, 128, 0.65);
      color: #dcfce7;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
    }

    .msg.err {
      display: block;
      background: rgba(220, 38, 38, 0.3);
      border: 1px solid rgba(248, 113, 113, 0.65);
      color: #fecaca;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
    }

    @media (max-width: 560px) {
      .grid {
        grid-template-columns: 1fr;
      }
      h1 {
        font-size: 36px;
      }
      .btn-order {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-photo" aria-hidden="true"></div>
  <div class="bg-overlay" aria-hidden="true"></div>

  <div class="wrap">
    <div class="brand">
      <h1>DOMADGARAGE</h1>
      <p class="sub">Vyber robotu alebo dopíš, čo treba spraviť na aute, navrhni termín a pošli žiadosť.</p>
    </div>

    <form id="bookingForm">
      <div class="grid">
        <div class="full">
          <label for="service">Druh opravy / služba *</label>
          <select id="service" name="service">
            <option value="" selected>-- Vyber druh opravy --</option>
            <option value="Výmena túrb">Výmena túrb</option>
            <option value="Autodiagnostika">Autodiagnostika</option>
            <option value="Výmena bŕzd">Výmena bŕzd (kotúče, platničky, strmene)</option>
            <option value="Výmena komplet olejov a filtrov">Výmena komplet olejov a filtrov</option>
            <option value="Zváranie / výroba / úprava výfukov">Zváranie / výroba / úprava výfukov</option>
            <option value="Výmena tlmičov a pružín">Výmena tlmičov a pružín</option>
            <option value="Oprava náprav a uložení">Oprava náprav a uložení (ramená, čapy, silentbloky)</option>
            <option value="Výmena poloosí, manžiet a kĺbov">Výmena poloosí, manžiet a kĺbov</option>
            <option value="Spojka / zotrvačník / rozvody">Spojka / zotrvačník / rozvody</option>
            <option value="Príprava na STK / EK">Príprava na STK / EK</option>
            <option value="Iný servis / zákazka podľa dohody">Iný servis / zákazka podľa dohody</option>
          </select>
        </div>

        <div class="full">
          <label for="other_repair">Iné opravy (ak tu niečo nie je v ponuke)</label>
          <input type="text" id="other_repair" name="other_repair" placeholder="Napr. únik oleja, podvozok, zvar na karosérii, úprava..." />
          <span class="hint">Ak ti chýba položka vyššie, napíš sem, čo presne treba spraviť.</span>
        </div>

        <div>
          <label for="preferred_date">Preferovaný dátum *</label>
          <input type="date" id="preferred_date" name="preferred_date" required />
        </div>

        <div>
          <label for="preferred_time">Preferovaný čas *</label>
          <select id="preferred_time" name="preferred_time" required>
            <option value="Ráno / doobeda">Ráno / doobeda</option>
            <option value="Poobede">Poobede</option>
            <option value="08:00">08:00</option>
            <option value="10:00">10:00</option>
            <option value="13:00">13:00</option>
            <option value="15:00">15:00</option>
            <option value="17:00">17:00</option>
          </select>
        </div>

        <div>
          <label for="customer_name">Meno a priezvisko *</label>
          <input type="text" id="customer_name" name="customer_name" placeholder="Napr. Jozef Kováč" />
        </div>

        <div>
          <label for="phone">Telefónne číslo *</label>
          <input type="tel" id="phone" name="phone" placeholder="+421 9xx xxx xxx" required />
        </div>

        <div class="full">
          <label for="email">E-mail (nepovinné)</label>
          <input type="email" id="email" name="email" placeholder="napr. meno@domena.sk" />
        </div>

        <div>
          <label for="vehicle">Auto (značka, model a motor) *</label>
          <input type="text" id="vehicle" name="vehicle" placeholder="Napr. BMW E46 320d 110 kW" required />
        </div>

        <div>
          <label for="license_plate">ŠPZ / EČV (nepovinné)</label>
          <input type="text" id="license_plate" name="license_plate" placeholder="Napr. SP000AA" />
        </div>

        <div class="full">
          <label for="note">Popis *</label>
          <textarea id="note" name="note" placeholder="Napíš podrobnejší popis závady alebo požiadavky..." required></textarea>
        </div>
      </div>

      <input type="text" name="website" class="hp" tabindex="-1" autocomplete="off" />

      <div class="submit-wrap">
        <button type="submit" id="submitBtn" class="btn-order" disabled>OBJEDNAŤ SA</button>
        <div id="reqStatus" class="req-status"></div>
      </div>

      <div id="msg" class="msg"></div>
    </form>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL = "https://ijeakszzdsixyueqfdj.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_PSviYvSVJXzi7YG1uPyQ-A_TdhME8MH";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const form = document.getElementById("bookingForm");
    const btn = document.getElementById("submitBtn");
    const reqStatus = document.getElementById("reqStatus");
    const msg = document.getElementById("msg");
    const dateInput = document.getElementById("preferred_date");
    const serviceInput = document.getElementById("service");
    const otherRepairInput = document.getElementById("other_repair");
    const phoneInput = document.getElementById("phone");
    const vehicleInput = document.getElementById("vehicle");
    const noteInput = document.getElementById("note");

    const today = new Date().toISOString().split("T")[0];
    dateInput.min = today;

    let isSubmitting = false;

    function getMissingFields() {
      const missing = [];
      const hasService = Boolean(serviceInput.value.trim());
      const hasOther = Boolean(otherRepairInput.value.trim());

      if (!hasService && !hasOther) {
        missing.push("druh opravy alebo iné opravy");
      }
      if (!vehicleInput.value.trim()) {
        missing.push("auto");
      }
      if (!phoneInput.value.trim()) {
        missing.push("telefónne číslo");
      }
      if (!noteInput.value.trim()) {
        missing.push("popis");
      }
      if (!dateInput.value || dateInput.value < today) {
        missing.push("platný dátum");
      }
      return missing;
    }

    function updateButtonState() {
      if (isSubmitting) {
        btn.disabled = true;
        btn.textContent = "ODOSIELAM...";
        return;
      }

      const missing = getMissingFields();
      const ready = missing.length === 0;

      btn.disabled = !ready;
      btn.textContent = "OBJEDNAŤ SA";

      if (ready) {
        reqStatus.textContent = "Všetko potrebné je vyplnené, môžeš sa objednať.";
        reqStatus.className = "req-status ready";
      } else {
        reqStatus.textContent = "Doplň ešte: " + missing.join(", ");
        reqStatus.className = "req-status";
      }
    }

    [serviceInput, otherRepairInput, phoneInput, vehicleInput, noteInput, dateInput].forEach((el) => {
      el.addEventListener("input", updateButtonState);
      el.addEventListener("change", updateButtonState);
    });

    updateButtonState();

    function showMsg(type, text) {
      msg.className = "msg " + type;
      msg.textContent = text;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.className = "msg";

      const missing = getMissingFields();
      if (missing.length > 0) {
        updateButtonState();
        showMsg("err", "Najprv vyplň: " + missing.join(", ") + ".");
        return;
      }

      const data = new FormData(form);

      if (data.get("website")) {
        showMsg("ok", "Ďakujem za objednávku, vaša DOMADGARAGE");
        form.reset();
        dateInput.min = today;
        updateButtonState();
        return;
      }

      isSubmitting = true;
      updateButtonState();

      const chosenService = String(data.get("service") || "").trim();
      const otherRepair = String(data.get("other_repair") || "").trim();
      const finalService = chosenService || (otherRepair ? `Iné: ${otherRepair}` : "Iný servis / zákazka podľa dohody");
      const baseNote = String(data.get("note") || "").trim();
      const combinedNote = [
        otherRepair ? `Iné opravy: ${otherRepair}` : "",
        baseNote
      ].filter(Boolean).join("\n\n") || null;

      const payload = {
        service: finalService,
        preferred_date: String(data.get("preferred_date") || ""),
        preferred_time: String(data.get("preferred_time") || "").trim(),
        customer_name: String(data.get("customer_name") || "").trim() || "Neuvedené",
        phone: String(data.get("phone") || "").trim(),
        email: String(data.get("email") || "").trim() || null,
        vehicle: String(data.get("vehicle") || "").trim(),
        license_plate: String(data.get("license_plate") || "").trim().toUpperCase() || null,
        note: combinedNote
      };

      const { error } = await supabase.from("reservations").insert([payload]);

      isSubmitting = false;

      if (error) {
        updateButtonState();
        showMsg("err", "Nepodarilo sa odoslať objednávku. Skontroluj údaje alebo skús znova.");
        console.error(error);
        return;
      }

      form.reset();
      dateInput.min = today;
      updateButtonState();
      showMsg("ok", "Ďakujem za objednávku, vaša DOMADGARAGE");
    });
  </script>
</body>
</html>
